[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afsheen-job-tracker"
version = "0.1.0"
description = "Private background design job discovery and application tracking"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "python-docx>=1.1,<2", "pypdf>=5,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
job-tracker = "job_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["job_tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
